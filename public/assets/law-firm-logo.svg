<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background dark blue -->
  <rect width="500" height="500" fill="#081827" rx="8" />
  
  <!-- Subtle border -->
  <rect x="10" y="10" width="480" height="480" fill="none" stroke="#c9a959" stroke-width="2" stroke-opacity="0.3" rx="6" />

  <!-- Scale / Balanza dorada -->
  <g id="scale" stroke="#c9a959" fill="#c9a959" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top finial / arrow point -->
    <polygon points="250,55 242,85 258,85" stroke-width="2" />
    <circle cx="250" cy="95" r="7" />

    <!-- Central Pillar / Mast -->
    <line x1="250" y1="95" x2="250" y2="340" stroke-width="8" />
    
    <!-- Decorative rings on column -->
    <ellipse cx="250" cy="180" rx="14" ry="4" stroke-width="2" />
    <ellipse cx="250" cy="270" rx="16" ry="5" stroke-width="2" />

    <!-- Base -->
    <path d="M 190,340 L 310,340 L 325,365 L 175,365 Z" stroke-width="3" />
    <rect x="160" y="365" width="180" height="15" rx="4" stroke-width="2" />

    <!-- Horizontal Beam -->
    <!-- Center fulcrum bracket -->
    <polygon points="238,125 262,125 250,145" stroke-width="2" />
    <!-- Main beam with graceful taper -->
    <path d="M 100,135 Q 250,120 400,135" fill="none" stroke-width="7" />
    <!-- Beam endpoints -->
    <circle cx="100" cy="135" r="6" />
    <circle cx="400" cy="135" r="6" />

    <!-- Left Pan Assembly -->
    <!-- Suspension strings -->
    <line x1="100" y1="135" x2="55" y2="240" stroke-width="3" />
    <line x1="100" y1="135" x2="145" y2="240" stroke-width="3" />
    <!-- Left Pan -->
    <path d="M 50,240 Q 100,285 150,240 Z" stroke-width="3" />
    <line x1="45" y1="240" x2="155" y2="240" stroke-width="4" />

    <!-- Right Pan Assembly -->
    <!-- Suspension strings -->
    <line x1="400" y1="135" x2="355" y2="240" stroke-width="3" />
    <line x1="400" y1="135" x2="445" y2="240" stroke-width="3" />
    <!-- Right Pan -->
    <path d="M 350,240 Q 400,285 450,240 Z" stroke-width="3" />
    <line x1="345" y1="240" x2="455" y2="240" stroke-width="4" />
  </g>

  <!-- Typography: LAW FIRM LOGO -->
  <text x="250" y="420" 
        text-anchor="middle" 
        fill="#c9a959" 
        font-family="'Playfair Display', 'Cinzel', 'Times New Roman', serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="7">LAW FIRM LOGO</text>
  <text x="250" y="445" 
        text-anchor="middle" 
        fill="#e6cf8b" 
        font-family="'Lato', 'Helvetica', 'Arial', sans-serif" 
        font-size="12" 
        font-weight="300" 
        letter-spacing="5" 
        opacity="0.85">LEGAL CONSULTING GROUP</text>
</svg>

